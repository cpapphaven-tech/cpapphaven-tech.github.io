name: PlayMix Daily Trending Games

on:
  schedule:
    # Runs daily at 03:00 UTC (~08:30 IST)
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force refresh trending games'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: trending-games
  cancel-in-progress: false

jobs:
  update-trending-games:
    name: Generate & Validate Trending Games
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Uses standard libraries (urllib, xml, json), requests for extended robustness
          pip install requests

      - name: Run Trending Games Pipeline
        run: |
          python3 scripts/trending_games.py

      - name: Run SEO & Quality Validation Suite
        run: |
          python3 scripts/validate_trending_games.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Only stage the trending discovery page, data logs, and sitemap if modified
          git add TrendingGames/index.html data/ sitemap.xml
          
          if git diff --staged --quiet; then
            echo "ℹ️ No meaningful content changes detected. No commit created."
          else
            git commit -m "chore(trending): update daily trending games discovery"
            git push
            echo "🚀 Successfully updated and pushed TrendingGames discovery page!"
          fi
