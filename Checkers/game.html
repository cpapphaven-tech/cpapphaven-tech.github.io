<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Checkers Free Online | Classic 2 Player & AI Board Game | PlayMixGames</title>
    <meta name="description" content="Play Classic Checkers (Draughts) free online! Jump, capture, crown kings, and outsmart the AI or play locally in 2-player mode directly in your browser.">

    <!-- Libraries & Scripts -->
    <link rel="stylesheet" href="style.css">
    <script src="../ads.js"></script>
    <script type="module" src="../analytics.js"></script>
    <script defer src="game.js"></script>
</head>

<body>
    <!-- Game Header & Turn HUD -->
    <header>
        <div class="title-group">
            <h1>👑 Checkers</h1>
        </div>
        <div class="hud-turn-badge">
            <div class="turn-dot red" id="turn-dot"></div>
            <span id="turn-text">Your Turn</span>
        </div>
    </header>

    <!-- Score & Piece Count Bar -->
    <div class="score-bar">
        <div class="score-card red">
            <span class="score-label">🔴 Red Pieces</span>
            <span class="score-val" id="count-red">12</span>
        </div>
        <div class="score-card draw">
            <span class="score-label">Score (R / B)</span>
            <span class="score-val"><span id="score-red">0</span> - <span id="score-black">0</span></span>
        </div>
        <div class="score-card black">
            <span class="score-label">⚫ Black Pieces</span>
            <span class="score-val" id="count-black">12</span>
        </div>
    </div>

    <!-- Toolbar: Mode, Difficulty & Reset -->
    <div class="toolbar">
        <div class="bar-row">
            <button class="pill-btn mode-btn active" data-mode="ai">🤖 vs AI</button>
            <button class="pill-btn mode-btn" data-mode="pvp">👥 2 Players</button>
            <button class="pill-btn diff-btn" data-diff="easy">Easy</button>
            <button class="pill-btn diff-btn active" data-diff="medium">Medium</button>
            <button class="pill-btn diff-btn" data-diff="master">Master</button>
            <button class="pill-btn" id="restart-btn" style="background: rgba(239, 68, 68, 0.2); border-color: #ef4444; color: #fca5a5;">🔄 New</button>
        </div>
    </div>

    <!-- 8x8 Board Wrapper -->
    <div class="board-wrapper">
        <div class="checker-board" id="checker-board"></div>
    </div>

    <!-- Game Over Win Modal -->
    <div class="modal" id="win-modal">
        <div class="modal-box">
            <h2 class="win-title" id="win-title">🎉 Red Wins!</h2>
            <p class="modal-desc" id="win-desc">Masterful strategy! You captured all opponent pieces.</p>
            <button class="action-btn" id="play-again-btn">Play Again 🚀</button>
        </div>
    </div>

    <!-- Bottom Ad Container -->
    <div id="pmg-bottom-ad" style="width: 100%; position: fixed; bottom: 0; left: 0; z-index: 40; display: flex; justify-content: center;"></div>

    <script>
        // Trigger bottom banner injection from ads.js
        window.addEventListener('load', function () {
            if (typeof prepSystem === 'function') prepSystem();
        });
    </script>
</body>

</html>
