<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Slope Game Free Online | 3D Ball Speed Runner Unblocked | PlayMixGames</title>
    <meta name="description" content="Play Slope Game free online! Steer and bounce your 3D neon ball over red obstacles, perform thrilling jumps, and test your reaction speed at breakneck velocity.">

    <!-- Libraries & Scripts -->
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="../ads.js"></script>
    <script type="module" src="../analytics.js"></script>
    <script defer src="game.js"></script>
</head>

<body>
    <!-- Game Header & HUD -->
    <header>
        <div class="title-group">
            <h1>⚡ Slope 3D</h1>
        </div>
        <div class="hud-stats">
            <div class="stat-chip">
                <span class="stat-label">Score</span>
                <span class="stat-value" id="score-val">0</span>
            </div>
            <div class="stat-chip">
                <span class="stat-label">Speed</span>
                <span class="stat-value" id="speed-val">45</span>
            </div>
            <div class="stat-chip">
                <span class="stat-label">Best</span>
                <span class="stat-value" id="high-val">0</span>
            </div>
        </div>
    </header>

    <!-- 3D Viewport Container -->
    <div id="canvas-container">
        <!-- Mobile Touch Steering & Jump Buttons -->
        <div class="touch-controls">
            <button class="touch-btn" id="btn-left" aria-label="Steer Left">◀</button>
            <button class="touch-btn jump-btn" id="btn-jump" aria-label="Jump / Bounce Above Obstacle">▲ JUMP</button>
            <button class="touch-btn" id="btn-right" aria-label="Steer Right">▶</button>
        </div>

        <!-- Start Game Overlay -->
        <div class="start-overlay" id="start-overlay">
            <h2>⚡ SLOPE 3D</h2>
            <p>Steer left/right and press <strong>▲ Up / Jump</strong> to bounce over red obstacles! The further you roll, the faster it gets.</p>
            <div class="play-prompt">🚀 TAP TO PLAY</div>
        </div>
    </div>

    <!-- Game Over Crash Modal -->
    <div class="modal" id="win-modal">
        <div class="modal-box">
            <h2>💥 CRASHED!</h2>
            <p style="color: #94a3b8; font-size: 0.9rem;">Bounce over obstacles with ▲ Up Arrow / Jump button!</p>
            <div class="results-grid">
                <div class="res-item">
                    <span class="res-label">Distance</span>
                    <span class="res-val" id="win-score">0</span>
                </div>
                <div class="res-item">
                    <span class="res-label">Best Distance</span>
                    <span class="res-val" id="win-high">0</span>
                </div>
            </div>
            <button class="action-btn" id="play-again-btn">Play Again 🚀</button>
        </div>
    </div>

    <!-- Bottom Ad Container -->
    <div id="pmg-bottom-ad" style="width: 100%; position: fixed; bottom: 0; left: 0; z-index: 40; display: flex; justify-content: center;"></div>

    <script>
        // Trigger bottom banner injection from ads.js
        window.addEventListener('load', function () {
            if (typeof prepSystem === 'function') prepSystem();
        });
    </script>
</body>

</html>
