<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{BLOG_TITLE}} | PlayMix</title>
    <meta name="description" content="{{BLOG_DESCRIPTION}}">
    <link rel="icon" type="image/png" href="../img/192.png">
    <link rel="canonical" href="https://playmixgames.in/blog/{{BLOG_SLUG}}.html">
    <link rel="stylesheet" href="../portal-style.css">
    
    <!-- Open Graph -->
    <meta property="og:type" content="article">
    <meta property="og:url" content="https://playmixgames.in/blog/{{BLOG_SLUG}}.html">
    <meta property="og:title" content="{{BLOG_TITLE}} | PlayMix">
    <meta property="og:description" content="{{BLOG_DESCRIPTION}}">
    <meta property="og:image" content="https://playmixgames.in/img/covers/puzzle.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="800">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{BLOG_TITLE}} | PlayMix">
    <meta name="twitter:description" content="{{BLOG_DESCRIPTION}}">
    <meta name="twitter:image" content="https://playmixgames.in/img/covers/puzzle.png">

    <!-- Schemas -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Article",
      "datePublished": "{{PUBLISH_DATE}}",
      "dateModified": "{{PUBLISH_DATE}}",
      "headline": "{{BLOG_TITLE}}",
      "description": "{{BLOG_DESCRIPTION}}",
      "image": "https://playmixgames.in/img/covers/puzzle.png",
      "author": {
        "@type": "Organization",
        "name": "PlayMixGames",
        "url": "https://playmixgames.in"
      },
      "publisher": {
        "@type": "Organization",
        "name": "PlayMixGames",
        "logo": {
          "@type": "ImageObject",
          "url": "https://playmixgames.in/img/192.png"
        }
      },
      "mainEntityOfPage": {
        "@type": "WebPage",
        "@id": "https://playmixgames.in/blog/{{BLOG_SLUG}}.html"
      }
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [{
        "@type": "ListItem",
        "position": 1,
        "name": "Home",
        "item": "https://playmixgames.in/"
      },{
        "@type": "ListItem",
        "position": 2,
        "name": "Blog",
        "item": "https://playmixgames.in/blog/index.html"
      },{
        "@type": "ListItem",
        "position": 3,
        "name": "{{GAME_TITLE}}",
        "item": "https://playmixgames.in/blog/{{BLOG_SLUG}}.html"
      }]
    }
    </script>

    <style>
        .article-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            color: #f8fafc;
            line-height: 1.8;
        }
        .article-header {
            margin-bottom: 30px;
        }
        .article-title {
            font-size: 2.2rem;
            color: #38bdf8;
            margin-bottom: 15px;
            line-height: 1.25;
        }
        .article-meta {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }
        .article-hero-img {
            width: 100%;
            border-radius: 16px;
            margin-bottom: 30px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .article-body h2 {
            color: #38bdf8;
            font-size: 1.6rem;
            margin: 35px 0 15px;
        }
        .article-body h3 {
            color: #a855f7;
            font-size: 1.25rem;
            margin: 25px 0 10px;
        }
        .article-body p {
            margin-bottom: 18px;
            color: #cbd5e1;
            font-size: 1.05rem;
        }
        .article-body ul, .article-body ol {
            margin: 0 0 20px 24px;
            color: #cbd5e1;
        }
        .article-body li {
            margin-bottom: 8px;
        }
        .play-cta-box {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.15), rgba(168, 85, 247, 0.05));
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 16px;
            padding: 28px;
            text-align: center;
            margin: 35px 0;
        }
        .play-cta-btn {
            display: inline-block;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            color: #0f172a;
            font-weight: 800;
            font-size: 1.15rem;
            padding: 14px 36px;
            border-radius: 30px;
            text-decoration: none;
            box-shadow: 0 6px 25px rgba(56, 189, 248, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 15px;
        }
        .play-cta-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 30px rgba(56, 189, 248, 0.6);
        }
    </style>
</head>
<body style="background: #0a0a1a;">
    <div class="article-container">
        <div class="article-header">
            <h1 class="article-title">{{BLOG_TITLE}}</h1>
            <div class="article-meta">Published by PlayMix Games Team • 6 min read • {{PUBLISH_DATE_FORMATTED}}</div>
        </div>

        <img src="../img/covers/puzzle.png" alt="{{GAME_TITLE}}" class="article-hero-img">

        <div class="play-cta-box">
            <h3 style="margin-top: 0; color: #38bdf8;">Play Free in Browser!</h3>
            <p>{{GAME_DESCRIPTION}}</p>
            <a href="../{{FOLDER_NAME}}/index.html" class="play-cta-btn">Play {{GAME_TITLE}} Now ➔</a>
        </div>

        <div class="article-body">
            {{BLOG_CONTENT}}
        </div>

        <div class="play-cta-box">
            <h3 style="margin-top: 0; color: #38bdf8;">Ready for the Challenge?</h3>
            <p>Beat your high score and share with friends!</p>
            <a href="../{{FOLDER_NAME}}/index.html" class="play-cta-btn">Play {{GAME_TITLE}} Free ➔</a>
        </div>
    </div>
</body>
</html>
